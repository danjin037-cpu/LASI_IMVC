device: auto
output_dir: outputs/scene15
seeds: [0, 1, 2, 3, 4]

dataset:
  name: Scene15
  file_path: data/Scene_15.mat
  num_classes: 15
  num_samples_total: 4485
  missing_rate: 0.5

clip_view:
  feature_path: data/clip_cache/scene15_vitb32/clip_img_feat.pt

model:
  shared_dim: 128
  encoder_hidden_dims: [1024, 512]
  decoder_hidden_dims: [512, 1024]
  norm: bn

train:
  batch_size: 1024
  pretrain_epochs: 50
  joint_epochs: 100

optimizer:
  pretrain_lr: 0.0005
  joint_lr: 0.0001

loss:
  lambda_view_distill: 0.4
  lambda_single_proto: 0.2
  tau_t: 0.6
  tau_p: 0.45

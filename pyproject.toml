[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lasi-imvc"
version = "1.0.0"
description = "Strict incomplete multi-view clustering with legal CLIP semantic transfer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "LASI-IMVC Authors" }]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "torch>=2.0,<3",
]

[tool.setuptools.packages.find]
include = ["lasi_imvc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
